<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>External.net</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="AuthScreen" class="AuthScreen">
  <div class="AuthBox">
    <h1 id="AuthTitle">Login</h1>

    <div class="InputWrapper">
      <span class="InputPrefix">@</span>
      <input id="Email" type="email" placeholder="Email" autocomplete="email" maxlength="254">
    </div>

    <div class="InputWrapper" id="UsernameWrapper">
      <span class="InputPrefix">&lt;</span>
      <input id="Username" type="text" placeholder="Username" autocomplete="username" maxlength="24">
    </div>

    <div class="InputWrapper PasswordWrapper">
      <input id="Password" type="password" placeholder="#Password" autocomplete="current-password" minlength="6">
      <button id="PasswordToggle" class="PasswordToggle" type="button" aria-label="Show password">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/>
          <circle cx="12" cy="12" r="2.5"/>
        </svg>
      </button>
    </div>

    <p id="AuthMessage" class="AuthMessage"></p>

    <div class="AuthActions">
      <button id="SubmitAuth" class="AuthButton Primary" type="button">Login</button>
    </div>

    <p class="AuthSwitch">
      <span id="AuthSwitchText">Don't have an account?</span>
      <button id="AuthSwitchButton" type="button">Register</button>
    </p>
  </div>
</div>

<header class="TopBar">
  <div class="Logo">
    External.net
    <button class="Version" type="button">
      V2
      <span class="VersionTooltip">/0.0.3</span>
    </button>
  </div>
  <nav class="Navigation">
    <button class="NavButton active" data-page="executor">Executor Scripts</button>
    <button class="NavButton" data-page="html">HTML</button>
    <button class="NavButton" data-page="python">Python</button>
    <button class="NavButton" data-page="luau">LuaU</button>
  </nav>
  <input id="Searchbar" class="Searchbar" type="text" placeholder="Search...">
  <button id="AddButton" class="AddButton" type="button" aria-label="Add script" title="Add script">+</button>
</header>

<main class="Page">
  <h1 id="PageTitle">Executor Scripts</h1>
  <section id="ProjectGrid" class="ProjectGrid"></section>
</main>

<footer class="BottomBar">
  <span>External.net</span>
  <div class="FooterRight">
    <span id="UserLabel" class="UserLabel"></span>
    <button id="LogoutButton" class="LogoutButton" type="button">Logout</button>
    <span>V2</span>
  </div>
</footer>

<div id="DetailView" class="DetailView">
  <div class="DetailContent">
    <button id="BackButton" class="BackButton" type="button">← Back</button>
    <img id="DetailImage" class="DetailImage" src="" alt="">
    <h1 id="DetailTitle" class="DetailTitle"></h1>
    <p id="DetailCreator" class="DetailCreator"></p>
    <p id="DetailDescription" class="DetailDescription"></p>
    <div class="CodeBlock">
      <pre><code id="DetailCode"></code></pre>
      <button id="CopyCodeButton" class="AuthButton Primary" type="button">Receive</button>
    </div>
    <div class="CommentsSection">
      <h3>Comments</h3>
      <div id="CommentsList" class="CommentsList"></div>
      <div class="CommentForm">
        <input id="CommentInput" class="CommentInput" type="text" placeholder="Write a comment..." maxlength="1000">
        <button id="PostCommentButton" class="AuthButton Primary" type="button">Post</button>
      </div>
    </div>
  </div>
</div>

<div id="AddModal" class="Modal">
  <div class="ModalBox">
    <div class="ModalHeader">
      <h2>Upload Script</h2>
      <button id="CloseModal" class="ModalClose" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="ModalBody">
      <div class="Field">
        <label>Upload Image</label>
        <div class="UploadRow">
          <label class="UploadButton">
            Choose Image
            <input id="FileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          </label>
          <span id="FileName" class="FileName">No image selected</span>
        </div>
      </div>
      <div class="Field">
        <label for="ScriptLanguage">Language</label>
        <select id="ScriptLanguage" class="Select">
          <option value="executor">Executor Scripts</option>
          <option value="html">HTML</option>
          <option value="python">Python</option>
          <option value="luau">LuaU</option>
        </select>
      </div>
      <div class="Field">
        <label for="ScriptTitle">Title of the script</label>
        <input id="ScriptTitle" class="TextInput" type="text" placeholder="e.g. Infinite Yield" maxlength="100">
      </div>
      <div class="Field">
        <label for="ScriptDescription">Description</label>
        <textarea id="ScriptDescription" class="TextArea" rows="3" placeholder="What does this script do?" maxlength="2000"></textarea>
      </div>
      <div class="Field">
        <label for="ScriptCode">Code</label>
        <textarea id="ScriptCode" class="TextArea Code" rows="8" spellcheck="false" placeholder="Paste your code here..." maxlength="100000"></textarea>
      </div>
      <p id="AddMessage" class="AddMessage"></p>
    </div>
    <div class="ModalFooter">
      <button id="CancelAdd" class="AuthButton" type="button">Cancel</button>
      <button id="PublishScript" class="AuthButton Primary" type="button">Publish</button>
    </div>
  </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
